# Installed by piviki-infra bootstrap/bootstrap.sh; edit it in the repository, not on the host.
# @ADMIN_USER@ is the founder's login (--admin-user, recorded in /etc/piviki/admin-user).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AllowUsers @ADMIN_USER@ deploy
X11Forwarding no
AllowAgentForwarding no
MaxAuthTries 3
LoginGraceTime 30

# The deploy user's only command is the root-owned piviki-core checkout's deploy script (AD-21).
Match User deploy
	AllowTcpForwarding no
	PermitTTY no
	ForceCommand sudo -n /opt/piviki/core/deploy/deploy.sh "$SSH_ORIGINAL_COMMAND"
