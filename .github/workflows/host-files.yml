# Validates the bootstrap's host config files (bootstrap/files/) with the programs that read them
# on a host, before they can reach one: visudo (sudo-rs), nft, sshd, dockerd, apt-config. Runs in
# the hosts' Ubuntu release with the hosts' packages, because a validator from another sudo or
# release can accept what the host rejects (the sudoers lockout of 2026-11-05). Also shellchecks
# the bootstrap scripts, and checks the OpenTofu configuration (fmt and validate, no backend, no
# credentials). Changes nothing anywhere.
name: host-files

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: host-files-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    container:
      # The hosts' release (AD-17: Ubuntu LTS). Move this with the hosts.
      image: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
      # `nft -c` needs CAP_NET_ADMIN even to check a file; nothing is loaded.
      options: --cap-add NET_ADMIN
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the hosts' packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates curl sudo-rs openssh-server nftables shellcheck
          # Docker from Docker's repository, through the bootstrap's own docker.sources.
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          . /etc/os-release
          sed "s/@UBUNTU_CODENAME@/${UBUNTU_CODENAME:-$VERSION_CODENAME}/" \
            bootstrap/files/etc/apt/sources.list.d/docker.sources >/etc/apt/sources.list.d/docker.sources
          apt-get update -q
          apt-get install -y -q --no-install-recommends docker-ce
          # sshd -t refuses to run without host keys and its privilege separation directory.
          ssh-keygen -A
          install -d -m 0755 /run/sshd
      - name: Versions
        run: |
          sudo --version | head -1
          sudo --version | head -1 | grep -q '^sudo-rs ' # the hosts' sudo, not classic sudo
          nft --version
          sshd -V 2>&1 | head -1
          dockerd --version
      - run: bootstrap/validate-files.sh
      - run: shellcheck -x bootstrap/*.sh

  # tofu fmt and validate on each root (production's shared state and test), with the pinned
  # OpenTofu the spine names. No backend, no state, no Cloudflare credentials: nothing is planned.
  tofu:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      TOFU_VERSION: 1.13.2
      # sha256 of tofu_<version>_amd64.deb; move both together.
      TOFU_DEB_SHA256: 4ac1080e445fe4e6af87895be485390de256e3657add0fdaca18e2c286424396
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenTofu ${{ env.TOFU_VERSION }}
        run: |
          deb="tofu_${TOFU_VERSION}_amd64.deb"
          curl -fsSL -o "$deb" "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/${deb}"
          echo "${TOFU_DEB_SHA256}  ${deb}" | sha256sum -c -
          sudo dpkg -i "$deb"
          tofu version | head -1 | grep -qx "OpenTofu v${TOFU_VERSION}"
      - name: fmt
        run: tofu fmt -check -recursive -diff tofu
      - name: validate
        run: |
          for root in tofu/prod tofu/test; do
            echo "== $root"
            tofu -chdir="$root" init -backend=false -input=false -lockfile=readonly
            tofu -chdir="$root" validate
          done
      # Offline, mocked providers: test's resources are all test-named, on test hosts, and use the
      # shared zone and login method only by the ids passed in (AD-17).
      - name: test
        run: |
          tofu -chdir=tofu/test test
          tofu -chdir=tofu/modules/core-ingress init -backend=false -input=false -lockfile=readonly
          tofu -chdir=tofu/modules/core-ingress test
      # Test's state can own no shared resource: neither its root nor the module declares the zone,
      # a login method or a rule, or imports anything. Destroying test removes nothing shared.
      - name: test state owns nothing shared
        run: |
          if grep -rnE '^\s*(import\s*\{|resource\s+"cloudflare_(zone|zero_trust_access_identity_provider|ruleset)")' \
              --include='*.tf' tofu/test tofu/modules/core-ingress; then
            echo "FAIL  a shared resource or an import in test's configuration" >&2; exit 1
          fi
